name: CI

# Runs on every push and pull request to main. The pipeline is build-and-test
# only: deployment is out of scope, and the brief asks for "a simple pipeline
# for build and/or deployment".
#
# What is deliberately NOT here: anything that calls Bedrock. Both the index
# build and the retrieval comparison need AWS credentials, and storing a long
# lived access key as a repository secret for an interview exercise is a worse
# trade than leaving those steps to run locally. A production pipeline would
# assume a role through GitHub's OIDC provider instead, which issues short
# lived credentials and stores no secret at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check . --exclude .venv

      - name: Compile every module
        # Catches syntax errors and bad imports in files the tests do not reach,
        # such as the FastAPI layer.
        run: python -m compileall -q agent api ingest scripts data

      - name: Seed the mock database
        # data/ is gitignored, so the database has to be rebuilt here before
        # the verification tests can run.
        run: python data/seed_db.py

      - name: Run verification tests
        run: python scripts/test_verify.py
